<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3f7f1">

<title>Plant Care</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
 background:#f3f7f1;
 color:#18271d;
}

.app{
 max-width:650px;
 margin:auto;
 padding:28px 18px 100px;
}

.header{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:22px;
}

h1{
 margin:0;
 font-size:34px;
}

.subtitle{
 color:#718076;
 margin-top:5px;
}

.add{
 border:0;
 background:#1f6b3a;
 color:white;
 width:48px;
 height:48px;
 border-radius:50%;
 font-size:28px;
}

.summary{
 background:#dfeadd;
 padding:18px;
 border-radius:20px;
 margin-bottom:18px;
}

.summary strong{
 font-size:24px;
}

.card{
 background:white;
 border-radius:24px;
 padding:20px;
 margin-bottom:15px;
 box-shadow:0 2px 10px rgba(0,0,0,.03);
}

.cardtop{
 display:flex;
 justify-content:space-between;
 align-items:start;
 gap:10px;
}

.name{
 font-size:22px;
 font-weight:700;
}

.status{
 font-size:12px;
 padding:7px 10px;
 border-radius:20px;
 background:#edf2ec;
 white-space:nowrap;
}

.status.due{
 background:#ffe4dc;
 color:#a53218;
}

.info{
 color:#66746a;
 margin-top:10px;
 line-height:1.6;
}

.water{
 width:100%;
 border:0;
 border-radius:16px;
 padding:14px;
 margin-top:15px;
 background:#1f6b3a;
 color:white;
 font-size:16px;
 font-weight:700;
}

.secondary{
 width:100%;
 border:1px solid #d5ded3;
 border-radius:16px;
 padding:13px;
 margin-top:10px;
 background:white;
 color:#26372b;
 font-size:15px;
}

.history{
 margin-top:15px;
 border-top:1px solid #edf0ec;
 padding-top:12px;
 font-size:14px;
 color:#66746a;
}

.historyitem{
 padding:6px 0;
}

.modal{
 display:none;
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.4);
 padding:20px;
 align-items:center;
 justify-content:center;
 z-index:10;
}

.modal.show{display:flex}

.panel{
 background:white;
 width:100%;
 max-width:500px;
 border-radius:25px;
 padding:22px;
 max-height:90vh;
 overflow:auto;
}

.panel h2{margin-top:0}

label{
 display:block;
 font-weight:600;
 margin-top:15px;
}

input{
 width:100%;
 padding:13px;
 border:1px solid #ccd6ca;
 border-radius:13px;
 font-size:16px;
 margin-top:6px;
}

.preview{
 width:100%;
 max-height:240px;
 object-fit:cover;
 border-radius:16px;
 margin-top:10px;
 display:none;
}

.actions{
 display:flex;
 gap:10px;
 margin-top:20px;
}

.actions button{
 flex:1;
 border:0;
 padding:14px;
 border-radius:14px;
 font-size:15px;
 font-weight:600;
}

.save{
 background:#1f6b3a;
 color:white;
}

.cancel{
 background:#edf1ec;
}

.photo-note{
 font-size:12px;
 color:#7a877d;
 margin-top:5px;
}

.empty{
 text-align:center;
 padding:40px 10px;
 color:#78857b;
}

.delete{
 border:0;
 background:none;
 color:#b33b2e;
 font-size:13px;
 margin-top:15px;
 padding:8px 0;
}
</style>
</head>

<body>

<div class="app">

<div class="header">
<div>
<h1>🌱 Plant Care</h1>
<div class="subtitle">植物のお世話を記録しよう</div>
<div id="cloudStatus" style="font-size:12px;color:#718076;margin-top:4px">☁️ 接続設定待ち</div>
</div>

<button class="add" onclick="openAdd()">＋</button>
</div>

<div class="summary">
<div>今日チェックする植物</div>
<strong id="dueCount">0鉢</strong>
</div>

<div id="plants"></div>

</div>


<!-- 植物追加 -->

<div class="modal" id="addModal">
<div class="panel">

<h2>🌱 新しい植物</h2>

<label>
植物の名前
<input id="newName" placeholder="例：モンステラ">
</label>

<label>
水やりチェック間隔
<input id="newDays" type="number" min="1" value="7">
</label>

<label>
植物の写真
<input id="newPhoto" type="file" accept="image/*">
</label>

<img id="newPreview" class="preview">

<div class="actions">
<button class="cancel" onclick="closeAdd()">キャンセル</button>
<button class="save" onclick="addPlant()">追加する</button>
</div>

</div>
</div>


<!-- 水やり -->

<div class="modal" id="waterModal">
<div class="panel">

<h2 id="waterTitle">💧 水やり</h2>

<p>今日の植物の写真を残そう 📷</p>

<input id="waterPhoto" type="file" accept="image/*">

<img id="waterPreview" class="preview">

<div class="photo-note">
写真は端末内に保存し、Supabase設定後は水やり履歴にも同期します。
</div>

<div class="actions">
<button class="cancel" onclick="closeWater()">やめる</button>
<button class="save" onclick="confirmWater()">水やり完了 ✓</button>
</div>

</div>
</div>


<script>

const STORAGE_KEY="plantCareDataV1";

/*
  Supabase接続設定
  1) 下の SUPABASE_URL に Supabase の API URL
  2) SUPABASE_KEY に Publishable key (sb_publishable_...)
  を貼り付けてください。
  Secret key は絶対に貼り付けないでください。
*/
const SUPABASE_URL="https://exnlzmclmhzcoibacett.supabase.co";
const SUPABASE_KEY="sb_publishable_6Q8WIHAV5xgEwhZLabLYHA_nUmkhMv1";

let selectedPlant=null;

const defaultPlants=[
 {
  id:1,
  name:"パキラ",
  emoji:"🌳",
  days:10,
  last:null,
  history:[]
 },
 {
  id:2,
  name:"ミリオンバンブー",
  emoji:"🎋",
  days:7,
  last:null,
  history:[]
 },
 {
  id:3,
  name:"黄色い鉢の植物",
  emoji:"🌿",
  days:10,
  last:null,
  history:[]
 },
 {
  id:4,
  name:"サンスベリア",
  emoji:"🪴",
  days:20,
  last:null,
  history:[]
 }
];

function localLoad(){
 try{
   const data=localStorage.getItem(STORAGE_KEY);
   if(data)return JSON.parse(data);
 }catch(e){}
 return defaultPlants.map(p=>({...p,history:[...p.history]}));
}

let plants=localLoad();

function supabaseReady(){
 return (
  SUPABASE_URL.startsWith("https://") &&
  !SUPABASE_URL.includes("PASTE_YOUR_") &&
  SUPABASE_KEY.startsWith("sb_publishable_") &&
  !SUPABASE_KEY.includes("PASTE_YOUR_")
 );
}

function setCloudStatus(text){
 const el=document.getElementById("cloudStatus");
 if(el)el.textContent=text;
}

async function api(path,options={}){
 const headers={
   "apikey":SUPABASE_KEY,
   "Authorization":"Bearer "+SUPABASE_KEY,
   ...(options.headers||{})
 };
 const res=await fetch(
   SUPABASE_URL.replace(/\/$/,"")+"/rest/v1/"+path,
   {...options,headers}
 );
 if(!res.ok){
   const msg=await res.text();
   throw new Error(msg||("HTTP "+res.status));
 }
 if(res.status===204)return null;
 const body=await res.text();
 return body?JSON.parse(body):null;
}

async function loadFromSupabase(){
 if(!supabaseReady()){
   setCloudStatus("📱 iPhone内に保存中（Supabase未設定）");
   return;
 }
 try{
   setCloudStatus("☁️ クラウドから読み込み中…");
   const rows=await api(
     "plants?select=id,name,species,watering_interval,last_watered,photo_url,created_at&order=id.asc"
   );

   if(rows && rows.length){
     const cloudPlants=[];
     for(const row of rows){
       const records=await api(
         "watering_records?plant_id=eq."+encodeURIComponent(row.id)+
         "&select=watered_at,photo_url,note&order=watered_at.desc"
       );
       cloudPlants.push({
         id:row.id,
         name:row.name,
         emoji:(row.species||"🌱"),
         days:Number(row.watering_interval)||7,
         last:row.last_watered||null,
         history:(records||[]).map(r=>({
           date:(r.watered_at||"").slice(0,10),
           photo:r.photo_url||null
         }))
       });
     }
     plants=cloudPlants;
     localSave();
     render();
   }else{
     // 初回だけ、現在iPhone内にある植物をクラウドへ移す
     for(const p of plants){
       await upsertPlantToSupabase(p);
     }
   }
   setCloudStatus("☁️ Supabaseと同期済み");
 }catch(e){
   console.error(e);
   setCloudStatus("⚠️ クラウド接続失敗・iPhone内保存を使用");
 }
}

function localSave(){
 try{
   localStorage.setItem(STORAGE_KEY,JSON.stringify(plants));
 }catch(e){
   alert("iPhone内の保存容量がいっぱいになりました。写真を減らしてください。");
 }
}

async function upsertPlantToSupabase(p){
 if(!supabaseReady())return;
 await api("plants?on_conflict=id",{
   method:"POST",
   headers:{
     "Content-Type":"application/json",
     "Prefer":"resolution=merge-duplicates,return=minimal"
   },
   body:JSON.stringify({
     id:p.id,
     name:p.name,
     species:p.emoji||"🌱",
     watering_interval:Number(p.days)||7,
     last_watered:p.last||null,
     photo_url:null
   })
 });
}

async function save(){
 localSave();
 if(!supabaseReady())return;
 try{
   await Promise.all(plants.map(upsertPlantToSupabase));
   setCloudStatus("☁️ Supabaseと同期済み");
 }catch(e){
   console.error(e);
   setCloudStatus("⚠️ クラウド保存失敗・iPhone内には保存済み");
 }
}

function todayString(){

 const d=new Date();

 return (
  d.getFullYear()+"-"+
  String(d.getMonth()+1).padStart(2,"0")+"-"+
  String(d.getDate()).padStart(2,"0")
 );

}


function formatDate(date){

 if(!date)return "まだ記録なし";

 const d=new Date(date+"T12:00:00");

 return (
  d.getFullYear()+"/"+
  (d.getMonth()+1)+"/"+
  d.getDate()
 );

}


function nextDate(p){

 if(!p.last)return null;

 const d=new Date(p.last+"T12:00:00");

 d.setDate(
  d.getDate()+Number(p.days)
 );

 return d;

}


function isDue(p){

 if(!p.last)return true;

 const n=nextDate(p);

 const t=new Date();
 t.setHours(0,0,0,0);

 n.setHours(0,0,0,0);

 return n<=t;

}


function render(){

 const container=
 document.getElementById("plants");

 container.innerHTML="";

 let due=0;

 plants.forEach((p,index)=>{

  if(isDue(p))due++;

  const card=
  document.createElement("div");

  card.className="card";

  let next="水やり日を登録してください";

  if(p.last){

   const n=nextDate(p);

   next=
   "次回チェック："+
   n.getFullYear()+"/"+
   (n.getMonth()+1)+"/"+
   n.getDate();

  }

  let history="";

  if(p.history.length){

   history=
   '<div class="history"><strong>最近の記録</strong>';

   p.history
   .slice(0,5)
   .forEach(h=>{

    history+=
    '<div class="historyitem">'+
    "💧 "+formatDate(h.date)+
    (h.photo?"　📷":"")+
    "</div>";

   });

   history+="</div>";

  }

  card.innerHTML=`

   <div class="cardtop">

    <div class="name">
     ${p.emoji} ${escapeHTML(p.name)}
    </div>

    <div class="status ${isDue(p)?"due":""}">
     ${isDue(p)?"水やりチェック":"待機中"}
    </div>

   </div>

   <div class="info">

    💧 ${p.days}日ごと<br>

    最終水やり：
    ${formatDate(p.last)}<br>

    ${next}

   </div>

   <button
    class="water"
    onclick="openWater(${index})">
    💧 水やりした
   </button>

   ${history}

   <button
    class="delete"
    onclick="deletePlant(${index})">
    この植物を削除
   </button>

  `;

  container.appendChild(card);

 });

 document.getElementById("dueCount")
 .textContent=due+"鉢";

 if(!plants.length){

  container.innerHTML=
  '<div class="empty">＋から植物を追加しよう 🌱</div>';

 }

}


function openAdd(){

 document
 .getElementById("addModal")
 .classList.add("show");

}


function closeAdd(){

 document
 .getElementById("addModal")
 .classList.remove("show");

}


document
.getElementById("newPhoto")
.addEventListener("change",function(){

 previewFile(
  this,
  document.getElementById("newPreview")
 );

});


async function addPlant(){

 const name=
 document
 .getElementById("newName")
 .value.trim();

 let days=
 Number(
  document
  .getElementById("newDays")
  .value
 );

 if(!name){

  alert("植物の名前を入力してね 🌱");
  return;

 }

 if(!days || days<1){

  alert("水やり間隔を入力してね 💧");
  return;

 }

 plants.push({

  id:Date.now(),

  name:name,

  emoji:"🌱",

  days:days,

  last:null,

  history:[]

 });

 save();

 closeAdd();

 document
 .getElementById("newName")
 .value="";

 document
 .getElementById("newDays")
 .value=7;

 render();

}


function openWater(index){

 selectedPlant=index;

 const p=plants[index];

 document
 .getElementById("waterTitle")
 .textContent=
 "💧 "+p.name;

 document
 .getElementById("waterPhoto")
 .value="";

 const preview=
 document.getElementById("waterPreview");

 preview.style.display="none";

 preview.src="";

 document
 .getElementById("waterModal")
 .classList.add("show");

}


function closeWater(){

 document
 .getElementById("waterModal")
 .classList.remove("show");

 selectedPlant=null;

}


document
.getElementById("waterPhoto")
.addEventListener("change",function(){

 previewFile(
  this,
  document.getElementById("waterPreview")
 );

});


function previewFile(input,img){

 const file=input.files[0];

 if(!file)return;

 const reader=new FileReader();

 reader.onload=function(e){

  img.src=e.target.result;
  img.style.display="block";

 };

 reader.readAsDataURL(file);

}


async function confirmWater(){

 if(selectedPlant===null)return;

 const p=
 plants[selectedPlant];

 const date=
 todayString();

 const preview=
 document
 .getElementById("waterPreview");

 let photo=null;

 if(
  preview.style.display!=="none" &&
  preview.src
 ){

  photo=preview.src;

 }

 p.last=date;

 p.history.unshift({

  date:date,

  photo:photo

 });

 /*
 写真を保存しすぎると
 localStorageの容量を超えるので
 最新3枚だけ画像を残す
 */

 let photos=0;

 p.history.forEach(h=>{

  if(h.photo){

   photos++;

   if(photos>3){
    h.photo=null;
   }

  }

 });

 save();

 closeWater();

 render();

}


async function deletePlant(index){

 const p=plants[index];

 if(
  confirm(
   p.name+
   "を削除しますか？"
  )
 ){

  plants.splice(index,1);

  save();

  render();

 }

}


function escapeHTML(str){

 return str.replace(
  /[&<>"']/g,
  function(m){

   return ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
   })[m];

  }
 );

}


render();
loadFromSupabase();

</script>

</body>
</html>
